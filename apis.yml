aid: knight-fintech
name: Knight Fintech
description: >-
  Knight Fintech is a Mumbai-based banking technology company that sells digital lending
  infrastructure to Indian banks and NBFCs. It positions itself as "India's leading digital
  lending infrastructure platform", stating it powers 500+ financial institutions across
  co-lending, digital lending, treasury management, supply chain finance, embedded finance
  and credit line on UPI, alongside a Knight Aurix product line. The company describes its
  approach as cloud-first, API-driven middleware that integrates with legacy core banking
  systems without displacing them. It is enterprise sales-led: there is no public developer
  portal, no published API documentation, no SDKs and no self-service signup — evaluation
  runs through a scheduled demo.
