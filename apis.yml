  subdomain resolves, no OpenAPI/AsyncAPI/GraphQL spec, no llms.txt, no well-known documents,
  no packages on npm/PyPI/Maven/NuGet/RubyGems/crates.io, and no GitHub organization. The web
  host returns HTTP 200 with an identical SPA shell for every path, so path probes there are
  not evidence of existence (see well-known/knight-fintech-well-known.yml). The real findings
  this round were the company's published certifications and its domain security posture.
